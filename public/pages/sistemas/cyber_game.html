<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cyber Shield - UTP GAMES</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../components/sidebar.js" defer></script>

    <style>
      /* Estructura Base */
      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #080510;
      }

      .cyber-layout {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 20px;
        gap: 20px;
        height: calc(100% - 85px);
      }

      /* Panel de Estadísticas Superior */
      .stats-panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px 30px;
        backdrop-filter: blur(10px);
      }

      .stat-box {
        text-align: center;
      }
      .stat-label {
        font-size: 12px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .stat-value {
        font-size: 28px;
        font-weight: bold;
        font-family: "Consolas", monospace;
      }

      .lives {
        color: #ff4d6d;
        letter-spacing: 5px;
      }
      .score {
        color: #00c853;
        text-shadow: 0 0 10px rgba(0, 200, 83, 0.5);
      }

      /* Arena Central */
      .arena {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at center,
          rgba(0, 200, 83, 0.05) 0%,
          transparent 70%
        );
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
      }

      /* Líneas de red de fondo (decorativo) */
      .grid-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0;
      }

      /* Temporizador Circular */
      .timer-container {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        /* El conic-gradient se actualiza vía JS para el efecto de reloj */
        background: conic-gradient(#00c853 100%, transparent 0);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: -60px; /* Superpone el temporizador con la tarjeta */
        z-index: 2;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      .timer-inner {
        width: 100px;
        height: 100px;
        background: #0d081a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        color: #fff;
        font-family: "Consolas", monospace;
      }

      /* Tarjeta del Paquete de Datos */
      .packet-card {
        width: 450px;
        background: rgba(13, 8, 26, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 70px 30px 30px 30px; /* Padding top extra por el temporizador */
        z-index: 1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        transition: transform 0.1s;
      }

      .data-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 0;
        font-family: "Consolas", monospace;
      }
      .data-label {
        color: #888;
        font-size: 14px;
      }
      .data-val {
        color: #80deea;
        font-weight: bold;
        font-size: 15px;
      }

      .payload-box {
        margin-top: 15px;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 8px;
        color: #fff;
        font-family: "Consolas", monospace;
        font-size: 14px;
        min-height: 80px;
        word-break: break-all;
        border-left: 3px solid #c77dff;
      }

      /* Controles (Botones Arcade) */
      .controls {
        display: flex;
        gap: 30px;
        margin-top: 40px;
        z-index: 2;
      }

      .action-btn {
        width: 200px;
        padding: 20px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.2s;
        border: 2px solid;
        background: transparent;
      }

      .btn-allow {
        border-color: #00c853;
        color: #00c853;
        box-shadow: 0 0 15px rgba(0, 200, 83, 0.2);
      }
      .btn-allow:hover,
      .btn-allow:active {
        background: rgba(0, 200, 83, 0.2);
        box-shadow: 0 0 30px rgba(0, 200, 83, 0.5);
        transform: translateY(-2px);
      }

      .btn-block {
        border-color: #ff4d6d;
        color: #ff4d6d;
        box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
      }
      .btn-block:hover,
      .btn-block:active {
        background: rgba(255, 77, 109, 0.2);
        box-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
        transform: translateY(-2px);
      }

      .key-hint {
        font-size: 11px;
        opacity: 0.5;
        display: block;
        margin-top: 5px;
      }

      /* Efectos de Feedback */
      .flash-red {
        animation: flashRed 0.3s;
      }
      .flash-green {
        animation: flashGreen 0.3s;
      }

      @keyframes flashRed {
        0% {
          box-shadow: inset 0 0 100px rgba(255, 77, 109, 0.8);
        }
        100% {
          box-shadow: none;
        }
      }
      @keyframes flashGreen {
        0% {
          box-shadow: inset 0 0 100px rgba(0, 200, 83, 0.8);
        }
        100% {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="app">
      <app-sidebar></app-sidebar>

      <main class="content">
        <header class="header glass">
          <h1>Cyber Shield: Firewall Defender</h1>
        </header>

        <div class="cyber-layout">
          <div class="stats-panel">
            <div class="stat-box">
              <div class="stat-label">System Integrity (Vidas)</div>
              <div class="stat-value lives" id="ui-lives">❤️❤️❤️</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Threats Blocked</div>
              <div class="stat-value" id="ui-streak" style="color: #fff">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Score</div>
              <div class="stat-value score" id="ui-score">0000</div>
            </div>
          </div>

          <div class="arena" id="game-arena">
            <div class="grid-bg"></div>

            <div class="timer-container" id="timer-ring">
              <div class="timer-inner" id="timer-text">3.0s</div>
            </div>

            <div class="packet-card" id="packet-card">
              <div
                style="
                  text-align: center;
                  color: #aaa;
                  font-size: 12px;
                  margin-bottom: 15px;
                  letter-spacing: 2px;
                "
              >
                INCOMING PACKET INTERCEPTED
              </div>

              <div class="data-row">
                <span class="data-label">Source IP:</span>
                <span class="data-val" id="pkt-ip">...</span>
              </div>
              <div class="data-row">
                <span class="data-label">Protocol:</span>
                <span class="data-val" id="pkt-protocol">...</span>
              </div>
              <div class="data-row">
                <span class="data-label">Target Port:</span>
                <span class="data-val" id="pkt-port">...</span>
              </div>

              <div class="data-label" style="margin-top: 15px">
                Payload Content:
              </div>
              <div class="payload-box" id="pkt-payload">
                Waiting for network traffic...
              </div>
            </div>

            <div class="controls">
              <button
                class="action-btn btn-allow"
                onclick="handleDecision(false)"
              >
                ALLOW
                <span class="key-hint">[⬅ Flecha Izquierda]</span>
              </button>
              <button
                class="action-btn btn-block"
                onclick="handleDecision(true)"
              >
                BLOCK
                <span class="key-hint">[Flecha Derecha ➡]</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/packet_database.js"></script>
    <script src="../../js/cyber_game.js"></script>
  </body>
</html>
