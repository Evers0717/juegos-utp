<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>SQL Query Builder - UTP GAMES</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../components/sidebar.js" defer></script>

    <style>
      /* Estilos Específicos del Juego SQL */
      .app {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      .score-panel {
        display: flex;
        justify-content: space-around;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid rgba(0, 188, 212, 0.3);
      }
      .score-item {
        text-align: center;
        margin: 0 10px;
      }
      .label {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
        display: block;
      }
      .value {
        font-size: 20px;
        font-weight: bold;
        color: #ffd600;
        font-family: "Consolas", monospace;
      }

      .sql-layout {
        display: grid;
        grid-template-columns: 1fr 350px;
        grid-template-rows: auto 1fr auto;
        gap: 15px;
        padding: 15px;
        height: calc(100% - 80px);
      }

      /* Paneles */
      .panel {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px;
      }
      .neon-border {
        border-color: rgba(0, 200, 83, 0.4);
        box-shadow: 0 0 15px rgba(0, 200, 83, 0.1);
      }

      /* Info Nivel */
      .level-header {
        grid-column: 1 / 3;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .lives {
        color: #ff4d6d;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      /* Zonas de Drag & Drop */
      .drop-zone {
        min-height: 120px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px dashed rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 10px;
        padding: 15px;
        transition: all 0.3s ease;
      }
      .drop-zone.drag-over {
        border-color: #00c853;
        background: rgba(0, 200, 83, 0.1);
      }

      .palette-zone {
        min-height: 100px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
      }

      /* Bloques SQL */
      .sql-block {
        padding: 8px 16px;
        border-radius: 6px;
        font-family: "Consolas", monospace;
        font-weight: bold;
        font-size: 14px;
        cursor: grab;
        user-select: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #2b1f3e;
        color: #fff;
        transition: transform 0.1s;
      }
      .sql-block:active {
        cursor: grabbing;
        transform: scale(0.95);
      }

      /* Colores por tipo de palabra (Opcional, hace que se vea genial) */
      .block-keyword {
        border-color: #00bcd4;
        color: #00bcd4;
        box-shadow: 0 0 8px rgba(0, 188, 212, 0.3);
      } /* SELECT, FROM */
      .block-table {
        border-color: #ffd600;
        color: #ffd600;
        box-shadow: 0 0 8px rgba(255, 214, 0, 0.3);
      } /* Nombres */
      .block-operator {
        border-color: #00c853;
        color: #00c853;
      } /* =, >, AND */

      /* Terminal y Schema */
      .schema-panel {
        font-family: "Consolas", monospace;
        font-size: 13px;
        color: #aaa;
      }
      .schema-title {
        color: #fff;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .terminal {
        grid-column: 1 / 3;
        background: #0d081a;
        padding: 10px 15px;
        font-family: monospace;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="app">
      <app-sidebar></app-sidebar>

      <main class="content">
        <header class="header glass">
          <h1>SQL Builder - <span id="level-title">Cargando...</span></h1>
        </header>

        <div class="sql-layout">
          <div class="panel level-header neon-border">
            <div>
              <h3 style="color: #00c853; margin-bottom: 5px">
                🤖 Misión Activa:
              </h3>
              <p id="task-text">...</p>
            </div>
            <div class="score-panel glass">
              <div class="score-item">
                <span class="label">Puntaje Actual:</span>
                <span id="current-score" class="value">0</span>
              </div>
              <div class="score-item">
                <span class="label">Récord Local:</span>
                <span id="high-score" class="value">---</span>
              </div>
            </div>
            <div class="lives" id="lives-display">❤️❤️❤️</div>
          </div>

          <div class="panel">
            <h4 style="margin-bottom: 10px; color: #aaa">
              Zona de Ensamblaje (Arrastra los bloques aquí):
            </h4>
            <div id="drop-zone" class="drop-zone"></div>

            <h4 style="margin-top: 20px; margin-bottom: 10px; color: #aaa">
              Bloques Disponibles:
            </h4>
            <div id="palette-zone" class="palette-zone"></div>

            <div
              style="
                margin-top: 15px;
                display: flex;
                justify-content: space-between;
              "
            >
              <button
                class="play-btn"
                style="
                  background: rgba(255, 77, 109, 0.2);
                  border-color: #ff4d6d;
                "
                onclick="resetBlocks()"
              >
                Restablecer Bloques
              </button>
              <button
                class="play-btn"
                style="background: rgba(0, 200, 83, 0.2); border-color: #00c853"
                onclick="checkQuery()"
              >
                Verificar Consulta
              </button>
            </div>
          </div>

          <div class="panel">
            <h3 class="schema-title">🗄️ Esquema de Base de Datos</h3>
            <hr style="opacity: 0.2; margin: 10px 0" />
            <div id="schema-content" class="schema-panel"></div>
          </div>

          <div class="terminal" id="terminal-output">
            <span style="color: #aaa"
              >> Sistema Listo. Esperando consulta SQL...</span
            >
          </div>
        </div>
      </main>
    </div>
    <script src="../../js/utils.js"></script>
    <script src="../../js/sql_levels.js"></script>
    <script src="../../js/sql_game.js"></script>
  </body>
</html>
