<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Code Debugger - DevVibes</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../components/sidebar.js" defer></script>

    <style>
      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #080510;
      }

      /* Botón Estilo Cyberpunk */
      .btn-cyber {
        background: rgba(0, 188, 212, 0.05);
        border: 1px solid #00bcd4;
        color: #00bcd4;
        padding: 8px 15px;
        border-radius: 4px;
        font-family: "Consolas", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(0, 188, 212, 0.2);
      }

      .btn-cyber:hover {
        background: #00bcd4;
        color: #080510;
        box-shadow: 0 0 20px rgba(0, 188, 212, 0.6);
      }

      .btn-cyber.hint {
        border-color: #ffd600;
        color: #ffd600;
      }

      .btn-cyber.success {
        border-color: #00c853;
        color: #00c853;
      }

      /* Layout Ajustado para reducir espacios muertos */
      .debug-layout {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 15px;
        gap: 12px; /* Espacio reducido entre componentes */
        height: calc(100% - 85px);
      }

      .debug-stats {
        display: flex;
        gap: 15px;
        background: rgba(255, 255, 255, 0.03);
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-card {
        flex: 1;
        text-align: center;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
      }

      .stat-card:last-child {
        border-right: none;
      }

      .stat-label {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 18px;
        font-weight: bold;
        color: #fff;
        font-family: "Consolas", monospace;
      }

      /* Editor de Código */
      .editor-container {
        flex: 1; /* Esto hace que el editor crezca para llenar el espacio */
        background: rgba(20, 20, 20, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .editor-header {
        background: #252526;
        padding: 5px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }

      .file-tab {
        background: #1e1e1e;
        color: #00bcd4;
        padding: 6px 15px;
        border-top: 2px solid #00bcd4;
        font-size: 12px;
      }

      .code-display {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        font-family: "Consolas", monospace;
        font-size: 15px;
        line-height: 1.4;
        color: #d4d4d4;
      }

      .code-line {
        display: flex;
        cursor: pointer;
        padding: 1px 0;
      }

      .line-num {
        width: 35px;
        text-align: right;
        padding-right: 15px;
        color: #555;
        font-size: 13px;
      }

      /* Consola */
      .terminal-window {
        height: 100px; /* Consola más compacta */
        background: #000;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 12px;
        font-family: "Courier New", monospace;
        color: #00ff00;
      }

      .terminal-header {
        color: #555;
        font-size: 10px;
        margin-bottom: 5px;
      }

      .line-error {
        background: rgba(255, 77, 109, 0.2) !important;
      }
      .line-success {
        background: rgba(0, 200, 83, 0.2) !important;
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="app">
      <app-sidebar></app-sidebar>

      <main class="content">
        <header class="header glass">
          <h1>
            Code Review:
            <span id="level-name" style="color: #00bcd4">Buscando Bugs...</span>
          </h1>
        </header>

        <div class="debug-layout">
          <div class="debug-stats">
            <div class="stat-card">
              <div class="stat-label">Desafío</div>
              <div class="stat-value" id="challenge-count">1 / 5</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Puntaje</div>
              <div class="stat-value" id="current-score" style="color: #ffd600">
                0
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Récord</div>
              <div class="stat-value" id="high-score" style="color: #00bcd4">
                ---
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Lenguaje</div>
              <div
                class="stat-value"
                id="challenge-lang"
                style="color: #00bcd4"
              >
                JS
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Vidas</div>
              <div class="stat-value" id="lives-display">❤️❤️❤️</div>
            </div>

            <div
              class="stat-card"
              style="border: none; display: flex; align-items: center"
            >
              <button onclick="showHint()" class="btn-cyber hint">PISTA</button>
            </div>
          </div>

          <div class="editor-container">
            <div class="editor-header">
              <div class="file-tab">debug_module.js</div>
              <div style="font-size: 10px; color: #555">UTF-8</div>
            </div>
            <div id="code-display" class="code-display"></div>
          </div>

          <div class="terminal-window">
            <div class="terminal-header">CONSOLE OUTPUT</div>
            <div id="terminal-content">> SYSTEM_READY...</div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/challenges_data.js"></script>
    <script src="../../js/debug_game.js"></script>
  </body>
</html>
