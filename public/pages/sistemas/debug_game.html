<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Code Debugger - DevVibes</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../components/sidebar.js" defer></script>

    <style>
      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #080510;
      }
      /* Botón Estilo Cyberpunk / DevVibes */
      .btn-cyber {
        background: rgba(0, 188, 212, 0.05);
        border: 1px solid #00bcd4;
        color: #00bcd4;
        padding: 8px 20px;
        border-radius: 4px;
        font-family: "Consolas", monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 188, 212, 0.2);
      }

      .btn-cyber:hover {
        background: #00bcd4;
        color: #080510;
        box-shadow: 0 0 20px rgba(0, 188, 212, 0.6);
        transform: translateY(-2px);
      }

      .btn-cyber.hint {
        border-color: #ffd600;
        color: #ffd600;
        box-shadow: 0 0 10px rgba(255, 214, 0, 0.2);
      }

      .btn-cyber.hint:hover {
        background: #ffd600;
        color: #080510;
        box-shadow: 0 0 20px rgba(255, 214, 0, 0.6);
      }

      .btn-cyber.success {
        border-color: #00c853;
        color: #00c853;
      }

      .btn-cyber.success:hover {
        background: #00c853;
        color: #080510;
      }

      .debug-layout {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 20px;
        gap: 20px;
        height: calc(100% - 85px);
      }

      /* Panel del Editor de Código */
      .editor-container {
        flex: 1;
        background: rgba(30, 30, 30, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .editor-header {
        background: #252526;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }

      .file-tab {
        background: #1e1e1e;
        color: #00bcd4;
        padding: 8px 20px;
        border-top: 2px solid #00bcd4;
        font-size: 13px;
        font-family: "Consolas", monospace;
      }

      /* Área de líneas de código */
      .code-display {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 16px;
        line-height: 1.5;
        color: #d4d4d4;
        counter-reset: line;
      }

      .code-line {
        display: flex;
        cursor: pointer;
        transition: background 0.2s;
        border-radius: 4px;
        padding: 2px 0;
      }

      .code-line:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      /* Número de línea */
      .line-num {
        width: 40px;
        text-align: right;
        padding-right: 20px;
        color: #858585;
        user-select: none;
        font-size: 14px;
      }

      .code-text {
        white-space: pre;
      }

      /* Consola Inferior */
      .terminal-window {
        height: 150px;
        background: #000;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 15px;
        font-family: "Courier New", monospace;
        font-size: 14px;
        color: #00ff00;
        overflow-y: auto;
        box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
      }

      .terminal-header {
        color: #888;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 10px;
        border-bottom: 1px solid #222;
        padding-bottom: 5px;
      }

      /* Feedback visual */
      .line-error {
        background: rgba(255, 77, 109, 0.2) !important;
      }
      .line-success {
        background: rgba(0, 200, 83, 0.2) !important;
      }

      /* Estilo del "Bug Hunter" (HUD Superior) */
      .debug-stats {
        display: flex;
        gap: 20px;
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-card {
        flex: 1;
        text-align: center;
      }
      .stat-label {
        font-size: 11px;
        color: #aaa;
        text-transform: uppercase;
      }
      .stat-value {
        font-size: 20px;
        font-weight: bold;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="app">
      <app-sidebar></app-sidebar>

      <main class="content">
        <header class="header glass">
          <h1>
            Code Review:
            <span id="level-name" style="color: #00bcd4">Buscando Bugs...</span>
          </h1>
        </header>

        <div class="debug-layout">
          <div class="debug-stats">
            <div class="stat-card">
              <div class="stat-label">Desafío</div>
              <div class="stat-value" id="challenge-count">3 / 5</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Lenguaje</div>
              <div
                class="stat-value"
                id="challenge-lang"
                style="color: #ffd600"
              >
                JavaScript
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Vidas del Sistema</div>
              <div class="stat-value" id="lives-display">❤️❤️❤️</div>
            </div>

            <div class="stat-card">
              <button onclick="showHint()" class="btn-cyber hint">
                [ SOLICITAR_PISTA ]
              </button>
            </div>
          </div>

          <div class="editor-container">
            <div class="editor-header">
              <div class="file-tab">main_logic.js</div>
              <div style="font-size: 12px; color: #555">UTF-8</div>
            </div>
            <div id="code-display" class="code-display"></div>
          </div>

          <div class="terminal-window">
            <div class="terminal-header">Debug Console Output</div>
            <div id="terminal-content">
              > System initialized. Select the line containing the bug...
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/challenges_data.js"></script>
    <script src="../../js/debug_game.js"></script>
  </body>
</html>
