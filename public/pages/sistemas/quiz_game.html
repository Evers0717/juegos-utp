<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>¿Quién quiere ser Senior? - UTP GAMES</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../components/sidebar.js" defer></script>

    <style>
      /* Estructura Base */
      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #080510;
      }

      .quiz-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        flex: 1;
        padding: 20px;
        gap: 15px; /* Reducido para optimizar espacio */
        height: calc(100% - 85px);
      }

      /* ==========================================
        HUD DE PUNTAJE (NUEVO)
      ========================================== */
      .quiz-stats {
        display: flex;
        justify-content: space-around;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(0, 188, 212, 0.2);
        margin-bottom: 15px;
      }
      .stat-item {
        text-align: center;
      }
      .stat-item .label {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
        display: block;
      }
      .stat-item .value {
        font-size: 22px;
        font-weight: bold;
        color: #ffd600;
        font-family: "Consolas", monospace;
      }

      /* ==========================================
        ARENA CENTRAL
      ========================================== */
      .quiz-arena {
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centrado vertical */
        position: relative;
      }

      .question-box {
        background: rgba(13, 8, 26, 0.95);
        border: 2px solid #00bcd4;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        margin-bottom: 20px;
        box-shadow: 0 0 30px rgba(0, 188, 212, 0.2);
        position: relative;
      }

      .question-number {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        background: #00bcd4;
        color: #000;
        padding: 5px 20px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 12px;
        text-transform: uppercase;
      }

      .question-text {
        color: #fff;
        font-size: 22px;
        line-height: 1.3;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn-opcion {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 18px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        transition: 0.2s;
      }

      .btn-opcion:hover {
        border-color: #00bcd4;
        background: rgba(0, 188, 212, 0.1);
      }

      .btn-opcion.seleccionado {
        border-color: #ffd600;
        color: #ffd600;
      }
      .btn-opcion.correcta {
        border-color: #00c853;
        background: rgba(0, 200, 83, 0.2);
        color: #00c853;
      }
      .btn-opcion.incorrecta {
        border-color: #ff4d6d;
        background: rgba(255, 77, 109, 0.2);
        color: #ff4d6d;
      }

      /* ==========================================
        LADDER LATERAL
      ========================================== */
      .ladder-panel {
        background: rgba(20, 20, 25, 0.8);
        border-radius: 12px;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .ladder-list {
        list-style: none;
        display: flex;
        flex-direction: column-reverse;
        gap: 3px;
      }

      .ladder-step {
        padding: 5px 10px;
        font-size: 12px;
        color: #444;
        font-family: monospace;
        display: flex;
        justify-content: space-between;
      }

      .ladder-step.active {
        background: rgba(0, 188, 212, 0.2);
        color: #00bcd4;
        border-left: 3px solid #00bcd4;
      }

      .ladder-step.passed {
        color: #00c853;
        opacity: 0.5;
      }

      /* Timer */
      .timer-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
      }
      .quiz-timer-ring {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .quiz-timer-inner {
        width: 65px;
        height: 65px;
        background: #080510;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #quiz-timer-text {
        font-size: 24px;
        font-weight: bold;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="app">
      <app-sidebar></app-sidebar>

      <main class="content">
        <header class="header glass">
          <h1>
            Entrevista Técnica:
            <span id="rango-actual" style="color: #00bcd4"
              >Buscando perfil...</span
            >
          </h1>
        </header>

        <div class="quiz-layout">
          <div class="quiz-arena" id="juego-arena">
            <div class="quiz-stats">
              <div class="stat-item">
                <span class="label">Puntaje Actual</span>
                <span id="current-score" class="value">0</span>
              </div>
              <div class="stat-item">
                <span class="label">Récord Local</span>
                <span id="high-score" class="value">---</span>
              </div>
            </div>

            <div class="timer-wrapper">
              <div class="quiz-timer-ring" id="quiz-timer-ring">
                <div class="quiz-timer-inner">
                  <span id="quiz-timer-text">10</span>
                </div>
              </div>
            </div>

            <div class="question-box">
              <div class="question-number" id="pregunta-numero">
                CARGANDO...
              </div>
              <h2 class="question-text" id="pregunta-texto">
                Preparando entorno de ejecución...
              </h2>
            </div>

            <div class="options-grid" id="opciones-contenedor"></div>
          </div>

          <div class="ladder-panel">
            <div
              style="
                color: #555;
                font-size: 10px;
                text-align: center;
                margin-bottom: 10px;
              "
            >
              PROGRESSION_LADDER
            </div>
            <ul class="ladder-list" id="ladder-list"></ul>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/quiz_questions.js"></script>
    <script src="../../js/quiz_game.js"></script>
  </body>
</html>
